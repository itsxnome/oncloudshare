appId: com.oncloudshare.app
productName: OnCloudShare
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  signAndEditExecutable: false
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
  category: public.app-category.utilities
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
